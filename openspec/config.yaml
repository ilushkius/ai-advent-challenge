schema: spec-driven

# Контекст проекта — впрыскивается во все OpenSpec-артефакты.
# Отражает стек, структуру, конвенции и ограничения проекта.
context: |
  AI Advent Challenge (ai-challenge): персональный ежедневный практикум по большим
  языковым моделям (LLM) и промпт-инжинирингу на реальных API: DeepSeek
  (OpenAI-совместимый endpoint, дни 1–4) и Hugging Face Inference Providers
  (день 5). Каждый день — одно небольшое самодостаточное задание в папке dayN/:
  День 1 — консольный скрипт; Дни 2–3 — Streamlit-демо; День 4 — документный
  эксперимент без кода (результат — day4/results.md); День 5 — Streamlit-демо
  сравнения трёх моделей Hugging Face разного размера (day5/app.py).

  Стек: Python 3.14 (Windows, PowerShell, VS Code), Streamlit, официальный OpenAI SDK
  (клиент DeepSeek, base_url строго https://api.deepseek.com), huggingface_hub
  (InferenceClient.chat_completion — OpenAI-совместимый формат через роутер
  Inference Providers). Модели DeepSeek: deepseek-chat (основная),
  deepseek-reasoner (может игнорировать temperature/response_format). Модели дня 5:
  meta-llama/Llama-3.1-8B-Instruct (8B), meta-llama/Llama-3.3-70B-Instruct (70B),
  Qwen/Qwen3-235B-A22B-Instruct-2507 (235B-A22B MoE). Общие утилиты DeepSeek — в
  корневом пакете shared/deepseek_utils.py
  (read_key_from_env_file, parse_stop_sequences, usage_to_dict, DEEPSEEK_BASE_URL);
  день 5 автономен, shared/ не использует.

  Ключевые конвенции:
  - Весь код, комментарии, UI и документация — на русском, с обучающими пояснениями.
  - API-ключи: DEEPSEEK_API_KEY (дни 1–4) и HF_TOKEN (день 5). Ищутся: .env в CWD →
    переменная окружения → ручной ввод. .env никогда не коммитится (игнорируется),
    в git только .env.example-шаблоны.
  - У каждого прикладного дня свои requirements.txt, .env и запуск из своей папки
    (CWD важен); документные дни (например, day4) зависимостей не имеют. У дня 5
    своё ВО day5/.venv (streamlit + huggingface_hub).
  - Приложения дня 2/3 импортируют shared/ из корня репозитория через
    sys.path.insert по __file__; день 5 автономен. Один файл = одно приложение дня;
    параметры запроса собираются в единый dict (источник правды для вызова и лога).
  - Inference Providers биллингует аккаунт HF: у бесплатных аккаунтов месячные
    включённые кредиты (~$0.10), при исчерпании API отвечает 402 Payment Required.
    Модели дня 5 должны быть в каталоге роутера; id из закрытого классического
    Inference API недоступны (400 model_not_supported).
  - Каждое демо показывает «сырой» запрос/параметры и метаданные ответа
    (finish_reason, usage, время) — проект учебный, ведётся для наглядности/видео.
  - Регрессия проверяется вручную: py_compile всех .py + streamlit.testing.AppTest
    (день 5 — интерпретатором day5/.venv, где установлен huggingface_hub);
    автотестов, линтеров, CI и pyproject.toml в проекте нет.

rules:
  proposal:
    - Пиши на русском языке
    - День задачи = одна capability-папка в openspec/specs (например, day4-rag)
    - Явно указывай, какие файлы кода затронуты
  specs:
    - Используй формат Given/When/Then
    - Описывай наблюдаемое поведение, а не имена функций и библиотек
    - Указывай грабли DeepSeek (base_url с api., ограничения deepseek-reasoner)
    - Для дня 5 указывай грабли Hugging Face: модели должны присутствовать в
      каталоге роутера Inference Providers, лимит кредитов — ошибка 402
  tasks:
    - Каждая задача — с проверяемым результатом (команда или observable behavior)
    - Разбивай на чанки не больше одной сессии

operations:
  apply:
    guidance:
      - Запуск приложений выполняй из папки дня (streamlit run app.py)
      - Для проверки синтаксиса используй python -m py_compile; для приложений
        day2/day3 — streamlit.testing.AppTest без реальных запросов к API; для
        day5 — AppTest интерпретатором day5/.venv (там установлен huggingface_hub)
      - Не коммить .env и реальные API-ключи; при изменениях обновляй .env.example
  archive:
    guidance:
      - Перед завершением убедись, что все чекбоксы задач отмечены
      - Сводку архива пиши кратко (что изменилось, какие файлы затронуты)
