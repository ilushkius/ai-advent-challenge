# Конфигурация pytest дня 21 (запуск тестов дня, см. AGENTS.md и скилл tdd-pytest-workflow).
#
# Запуск ИЗ ПАПКИ ДНЯ (CWD важен: .env ищется здесь):
#   uv run pytest -q                 # быстрый прогон: addopts уже ставит -m "not slow"
#   uv run pytest -m "" -q           # полный прогон: все тесты, включая slow
#   uv run pytest --run-slow -q      # то же самое флагом
#   uv run pytest --cov=backend --cov-report=term-missing   # покрытие бэкенда
#
# -n auto — тесты идут параллельно (pytest-xdist) по всем ядрам CPU: каждый тест
# работает на своей временной SQLite, общих файлов дня тесты не пишут.
# -m "not slow" — по умолчанию пропускаются тяжёлые тесты (подпроцессы
# MCP-серверов, интеграция и e2e): для повседневной работы хватает unit-набора.
#
# testpaths — папка с тестами дня (подпапки unit/, integration/, e2e/ —
# классификация по фикстурам: чистые модули / временная БД и агент / TestClient);
# pythonpath добавляет корень дня 21 и tests/ в sys.path, поэтому тесты
# импортируют модули как `from backend.agents.agent import Agent`, а общие
# фикстуры и фейки — как `from support import ...`.
[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra -n auto -m "not slow"
markers =
    slow: тяжёлые тесты (подпроцессы MCP-серверов, интеграция и e2e дольше секунды) — по умолчанию пропускаются
    remote: тесту нужен настоящий внешний сервис (туннель Cloudflare дня 30) — снимает запрет сети
