# Конфигурация pytest дня 9 (первый день проекта с автотестами, см. AGENTS.md).
#
# Запуск ИЗ ПАПКИ ДНЯ (CWD важен: .env ищется здесь):
#   .venv/Scripts/python -m pytest -q
#
# testpaths — папка с тестами дня; pythonpath добавляет корень дня 9 в sys.path,
# поэтому тесты импортируют модули как `from backend.agent import Agent`.
[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra
