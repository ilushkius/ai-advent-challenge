# Конфигурация pytest дня 13 (запуск тестов дня, см. AGENTS.md и скилл tdd-pytest-workflow).
#
# Запуск ИЗ ПАПКИ ДНЯ (CWD важен: .env ищется здесь):
#   .venv/Scripts/python -m pytest -q
#
# testpaths — папка с тестами дня; pythonpath добавляет корень дня 13 в sys.path,
# поэтому тесты импортируют модули как `from backend.agent import Agent`.
[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra
