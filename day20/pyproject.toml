[project]
name = "day20"
version = "0.1.0"
description = "День 20: оркестрация MCP-серверов (search, data, storage) и длинный флоу по трём серверам (FastAPI + Streamlit + SQLite)"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3,<4.0",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "mcp>=2.2.0",
    "openai>=3.14,<4.0",
    "pandas>=3.0,<4.0",
    "pytest>=9.1,<10.0",
    "requests>=2.34,<3.0",
    "sqlalchemy>=2.0.54,<3.0",
    "streamlit>=1.64,<2.0",
    "tiktoken>=0.14,<0.15",
    "uvicorn[standard]>=0.53,<0.54",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
